[project]
name = "iamrishab-profile"
version = "1.0.0"
description = "Compile Living Datum SVGs for the GitHub profile README."
requires-python = ">=3.12"
dependencies = [
  "fonttools>=4.60.0",
  "loguru>=0.7.3",
  "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
  "mypy>=1.18.0",
  "ruff>=0.13.0",
  "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts"]

[[tool.mypy.overrides]]
module = ["fontTools.*"]
ignore_missing_imports = true
