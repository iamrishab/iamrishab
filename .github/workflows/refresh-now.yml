name: refresh-now

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    paths:
      - content/now.yml
      - scripts/render_now.py
      - scripts/datum.py
      - assets/src/tokens.json

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run python scripts/render_now.py
      - name: commit now svgs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dist/now-light.svg assets/dist/now-dark.svg
          git diff --cached --quiet || git commit -m "Refresh now strip"
          git push
