<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Page modules preview</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .row { display: flex; }
  .col { flex: 1; min-width: 0; padding: 24px; box-sizing: border-box; }
  .light { background: #ffffff; color: #1f2328; }
  .dark { background: #0d1117; color: #e6edf3; }
  img { display: block; width: 100%; max-width: 880px; height: auto; margin: 8px 0 16px; }
  a { color: #0969da; }
  .dark a { color: #4493f8; }
  .phone { width: 390px; margin: 24px; }
  .emojis img { width: 64px; display: inline-block; margin: 6px; }
</style>
</head>
<body>
<div class="row">
<section class="col light">
  <img src="assets/dist/hero-light.svg" alt="hero">
  <img src="assets/dist/frame-light.svg" alt="frame">
  <p><a href="https://immovabletech.com">Immovable Tech</a></p>
  <img src="assets/dist/act-light.svg" alt="act">
  <img src="assets/dist/work-light.svg" alt="work">
  <img src="assets/dist/systems-light.svg" alt="systems">
  <img src="assets/dist/take-light.svg" alt="take">
  <img src="assets/dist/stack-light.svg" alt="stack">
  <img src="assets/dist/chips-light.svg" alt="chips">
  <img src="assets/dist/now-light.svg" alt="now">
  <img src="assets/dist/record-light.svg" alt="record">
  <img src="assets/dist/reach-light.svg" alt="reach">
  <div class="emojis">
    <img src="assets/dist/emoji-loop-light.svg" alt="loop">
    <img src="assets/dist/emoji-search-light.svg" alt="search">
    <img src="assets/dist/emoji-roof-light.svg" alt="roof">
    <img src="assets/dist/emoji-chat-light.svg" alt="chat">
    <img src="assets/dist/emoji-ocr-light.svg" alt="ocr">
    <img src="assets/dist/emoji-cart-light.svg" alt="cart">
    <img src="assets/dist/emoji-mail-light.svg" alt="mail">
    <img src="assets/dist/emoji-record-light.svg" alt="record">
  </div>
</section>
<section class="col dark">
  <img src="assets/dist/hero-dark.svg" alt="hero">
  <img src="assets/dist/frame-dark.svg" alt="frame">
  <img src="assets/dist/act-dark.svg" alt="act">
  <img src="assets/dist/work-dark.svg" alt="work">
  <img src="assets/dist/systems-dark.svg" alt="systems">
  <img src="assets/dist/take-dark.svg" alt="take">
  <img src="assets/dist/chips-dark.svg" alt="chips">
  <img src="assets/dist/record-dark.svg" alt="record">
  <img src="assets/dist/reach-dark.svg" alt="reach">
</section>
</div>
<section class="phone light">
  <img src="assets/dist/frame-light.svg" alt="frame 390">
  <img src="assets/dist/systems-light.svg" alt="systems 390">
  <img src="assets/dist/chips-light.svg" alt="chips 390">
  <img src="assets/dist/take-light.svg" alt="take 390">
</section>
</body>
</html>
